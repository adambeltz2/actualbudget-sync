name: Publish Docker Image
on:
  push:
    branches: ['main']

jobs:
  push_to_registry:
    name: Push Docker image to GHCR and Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # Checked out by branch name (not the default detached-HEAD SHA)
          # so the version-bump commit below can be pushed straight back.
          ref: ${{ github.ref }}
          fetch-depth: 0

      # Bumps package.json's patch version on every merge to main, so the
      # dashboard footer (GET /api/version) always moves forward instead of
      # staying frozen at whatever it was last manually set to — previously
      # only the git commit hash changed per release, not the version
      # number itself. [skip ci] on the bump commit prevents this push from
      # re-triggering this workflow (or test.yml) a second time.
      - name: Bump package.json patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          for i in 1 2 3; do
            git push && break
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep 2
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/actualbudget-sync:latest

      # Docker Hub's repo overview is unrelated to GitHub and has no idea
      # this repo exists — pushing images here was never going to update it.
      # Syncs it explicitly on every release using the same README.md GitHub
      # already renders (its screenshot links point at raw.githubusercontent.com
      # absolute URLs rather than repo-relative paths specifically so they
      # also resolve correctly from Docker Hub's page, not just GitHub's).
      # continue-on-error: this is a documentation nicety, not the release
      # itself (the image above already pushed successfully by this point) —
      # a Docker Hub API hiccup (e.g. a token permission issue) shouldn't
      # mark the whole run, and thus the actual image publish, as failed.
      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/actualbudget-sync
          readme-filepath: ./README.md
