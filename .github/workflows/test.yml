name: Test

on:
  pull_request:
  push:
    branches: ['main']

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails the build on a new high/critical vulnerability the moment it's
      # introduced (a new dependency, or an existing one's advisory getting
      # worse) rather than waiting to be caught by hand or by Dependabot's
      # weekly schedule. Moderate/low findings don't fail CI -- those are
      # Dependabot's job to open a PR for on its own schedule, not a reason
      # to block an unrelated change.
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Build-only (no push) validation that the Dockerfile still produces a
      # working image — publish.yml only runs on pushes to main, so without
      # this, a broken Dockerfile wouldn't surface until after it's merged.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
