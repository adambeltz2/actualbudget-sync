<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actual Budget Sync — Login</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
  <style>
    :root {
      --bg: #F1F0EC; --card-bg: #FFFFFF; --border: #F0EFEB;
      --text: #1E2A32; --text-secondary: #33404A; --text-muted: #8A93A0;
      --accent: #0EA894; --accent-dark: #0C8E7D; --negative: #C4573F;
      --shadow: 0 1px 2px rgba(30,42,50,0.04), 0 8px 24px rgba(30,42,50,0.06);
    }
    html.dark {
      --bg: #171D21; --card-bg: #1F262B; --border: #2C363D;
      --text: #EDEFF0; --text-secondary: #C7CDD1; --text-muted: #7C8890;
      --accent: #14BFA8; --accent-dark: #0EA894; --negative: #E0806A;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: 'Source Sans 3', system-ui, -apple-system, sans-serif;
    }
    .num { font-family: 'Sora', system-ui, sans-serif; }
    .card { background: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow); padding: 32px; width: 100%; max-width: 380px; }
    label.field-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; }
    input[type="password"] {
      width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card-bg); color: var(--text); font-family: inherit; font-size: 14px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { width: 100%; padding: 11px; border: none; border-radius: 10px; background: var(--accent); color: white; font-weight: 700; font-size: 14px; font-family: inherit; cursor: pointer; }
    button:hover { background: var(--accent-dark); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="num" style="font-size:19px; font-weight:800; margin-bottom:4px;">Actual Budget Smart Sync</div>
    <p id="subtitle" style="font-size:13.5px; color:var(--text-muted); margin-top:0; margin-bottom:22px;">Enter your dashboard password.</p>

    <form id="loginForm" style="display:flex; flex-direction:column; gap:16px;">
      <div>
        <label class="field-label">Password</label>
        <input type="password" id="password" required>
      </div>
      <div id="confirmField" hidden>
        <label class="field-label">Confirm Password</label>
        <input type="password" id="confirmPassword">
      </div>
      <p id="errorMsg" style="font-size:13px; color:var(--negative); margin:0;" hidden></p>
      <button type="submit">Sign In</button>
    </form>
  </div>

  <footer style="position:fixed; bottom:16px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:14px; font-size:12px; color:var(--text-muted);">
    <span>Actual Budget Smart Sync <span id="appVersion"></span></span>
    <a href="https://github.com/adambeltz2/actualbudget-sync" target="_blank" rel="noopener" style="color:var(--text-muted);">GitHub</a>
    <a href="https://www.buymeacoffee.com/adambeltz" target="_blank" rel="noopener" style="color:var(--text-muted);">☕ Buy Me a Coffee</a>
  </footer>

  <script>
    fetch('/api/version').then(r => r.json()).then(({ version }) => {
      document.getElementById('appVersion').innerText = version ? `v${version}` : '';
    }).catch(() => {});

    try {
      const stored = localStorage.getItem('theme');
      const isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', isDark);
    } catch (e) { /* localStorage may be unavailable; default light theme is fine */ }

    const errorMsg = document.getElementById('errorMsg');
    const subtitle = document.getElementById('subtitle');
    const confirmField = document.getElementById('confirmField');
    const confirmInput = document.getElementById('confirmPassword');
    let isFirstRun = false;

    fetch('/api/auth/status').then(r => r.json()).then(({ configured }) => {
      if (!configured) {
        isFirstRun = true;
        subtitle.innerText = 'No dashboard password is set yet. Choose one to secure this dashboard.';
        confirmField.hidden = false;
        confirmInput.required = true;
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.hidden = true;
      const password = document.getElementById('password').value;

      if (isFirstRun && password !== confirmInput.value) {
        errorMsg.innerText = 'Passwords do not match.';
        errorMsg.hidden = false;
        return;
      }

      let res;
      try {
        res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
      } catch (err) {
        errorMsg.innerText = 'Could not reach the server. Please try again.';
        errorMsg.hidden = false;
        return;
      }
      if (res.ok) {
        window.location.href = '/';
      } else {
        const data = await res.json().catch(() => ({}));
        errorMsg.innerText = data.error || 'Login failed.';
        errorMsg.hidden = false;
      }
    });
  </script>
</body>
</html>
