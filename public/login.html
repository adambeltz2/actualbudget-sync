<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actual Budget Sync — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 flex items-center justify-center min-h-screen font-sans transition-colors">
  <div class="max-w-sm w-full bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md">
    <h1 class="text-xl font-bold text-gray-700 dark:text-gray-100 mb-1">Actual Budget Smart Sync</h1>
    <p id="subtitle" class="text-sm text-gray-500 dark:text-gray-400 mb-6">Enter your dashboard password.</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-gray-700 dark:text-gray-200">Password</label>
        <input type="password" id="password" required class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
      </div>
      <div id="confirmField" class="hidden">
        <label class="block text-sm font-bold text-gray-700 dark:text-gray-200">Confirm Password</label>
        <input type="password" id="confirmPassword" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
      </div>
      <p id="errorMsg" class="text-sm text-red-600 dark:text-red-400 hidden"></p>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow transition">Sign In</button>
    </form>
  </div>

  <script>
    try {
      const stored = localStorage.getItem('theme');
      const isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', isDark);
    } catch (e) { /* localStorage may be unavailable; default light theme is fine */ }

    const errorMsg = document.getElementById('errorMsg');
    const subtitle = document.getElementById('subtitle');
    const confirmField = document.getElementById('confirmField');
    const confirmInput = document.getElementById('confirmPassword');
    let isFirstRun = false;

    fetch('/api/auth/status').then(r => r.json()).then(({ configured }) => {
      if (!configured) {
        isFirstRun = true;
        subtitle.innerText = 'No dashboard password is set yet. Choose one to secure this dashboard.';
        confirmField.classList.remove('hidden');
        confirmInput.required = true;
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      const password = document.getElementById('password').value;

      if (isFirstRun && password !== confirmInput.value) {
        errorMsg.innerText = 'Passwords do not match.';
        errorMsg.classList.remove('hidden');
        return;
      }

      let res;
      try {
        res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
      } catch (err) {
        errorMsg.innerText = 'Could not reach the server. Please try again.';
        errorMsg.classList.remove('hidden');
        return;
      }
      if (res.ok) {
        window.location.href = '/';
      } else {
        const data = await res.json().catch(() => ({}));
        errorMsg.innerText = data.error || 'Login failed.';
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
