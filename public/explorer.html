<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Explorer — Actual Budget Smart Sync</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #F1F0EC; --card-bg: #FFFFFF; --border: #F0EFEB;
      --text: #1E2A32; --text-secondary: #33404A; --text-muted: #8A93A0;
      --accent: #0EA894; --accent-dark: #0C8E7D;
      --positive: #1C8C74; --negative: #C4573F;
      --shadow: 0 1px 2px rgba(30,42,50,0.04), 0 8px 24px rgba(30,42,50,0.06);
    }
    html.dark {
      --bg: #171D21; --card-bg: #1F262B; --border: #2C363D;
      --text: #EDEFF0; --text-secondary: #C7CDD1; --text-muted: #7C8890;
      --accent: #14BFA8; --accent-dark: #0EA894;
      --positive: #2FBF9B; --negative: #E0806A;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 40px 24px 64px;
      background: var(--bg); color: var(--text);
      font-family: 'Source Sans 3', system-ui, -apple-system, sans-serif;
    }
    .shell { max-width: 1120px; margin: 0 auto; }
    .num { font-family: 'Sora', system-ui, sans-serif; }
    a { color: var(--accent); }
    .card { background: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow); }
    .card-soft { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; }
    .label-caps { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer;
      padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
      font-family: inherit; text-decoration: none; transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: var(--card-bg); color: var(--text-secondary); box-shadow: var(--shadow); }
    .btn-ghost:hover:not(:disabled) { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #FFFFFF; }
    .btn-primary:hover { background: var(--accent-dark); }
    label.field-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card-bg); color: var(--text); font-family: inherit; font-size: 13.5px;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th { text-align: left; padding: 12px; background: var(--card-bg); border-bottom: 1px solid var(--border); font-weight: 700; color: var(--text-secondary); }
    td { padding: 12px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    .error-banner {
      background: color-mix(in srgb, var(--negative) 12%, var(--card-bg));
      border: 1px solid color-mix(in srgb, var(--negative) 35%, var(--card-bg));
      color: var(--negative); font-size: 14px; padding: 12px 14px; border-radius: 10px; margin-bottom: 24px;
    }
    .notice-banner {
      background: color-mix(in srgb, var(--accent) 10%, var(--card-bg));
      border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--card-bg));
      color: var(--accent-dark); font-size: 14px; padding: 14px 16px; border-radius: 10px; margin-bottom: 24px;
    }
    .filters-grid { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 14px; }
    @media (max-width: 900px) { .filters-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="shell">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:12px;">
      <div>
        <div class="num" style="font-size:22px; font-weight:800;">Data Explorer</div>
        <p style="font-size:13.5px; color:var(--text-muted); margin:2px 0 0;">Browse the accounts, categories, and transactions from your last sync.</p>
      </div>
      <div style="display:flex; gap:10px;">
        <button id="themeToggleBtn" title="Toggle dark mode" class="btn btn-ghost">🌙</button>
        <a href="/" class="btn btn-ghost">Dashboard</a>
        <button id="logoutBtn" class="btn btn-ghost">Logout</button>
      </div>
    </div>

    <div id="errorBanner" class="error-banner" hidden></div>

    <div id="notConfiguredMsg" class="notice-banner" hidden>
      Actual Budget isn't configured yet. Set it up on the <a href="/" style="font-weight:700;">Dashboard</a> first.
    </div>

    <div id="explorerBody" hidden>
      <!-- Accounts -->
      <div style="margin-bottom:28px;">
        <div class="label-caps" style="margin-bottom:10px;">Accounts</div>
        <div id="accountsGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px;"></div>
      </div>

      <!-- Filters -->
      <div class="card" style="padding:20px; margin-bottom:24px;">
        <div class="filters-grid">
          <div>
            <label class="field-label">Account</label>
            <select id="filterAccount"><option value="">All accounts</option></select>
          </div>
          <div>
            <label class="field-label">Category</label>
            <select id="filterCategory"><option value="">All categories</option></select>
          </div>
          <div>
            <label class="field-label">From</label>
            <input type="date" id="filterStart">
          </div>
          <div>
            <label class="field-label">To</label>
            <input type="date" id="filterEnd">
          </div>
          <div>
            <label class="field-label">Search payee</label>
            <input type="text" id="filterSearch" placeholder="e.g. Amazon">
          </div>
          <div>
            <label class="field-label">Sort</label>
            <select id="filterSort">
              <option value="date_desc">Date (newest)</option>
              <option value="date_asc">Date (oldest)</option>
              <option value="amount_desc">Amount (high to low)</option>
              <option value="amount_asc">Amount (low to high)</option>
            </select>
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
          <button id="clearFiltersBtn" class="btn btn-ghost">Clear</button>
          <button id="applyFiltersBtn" class="btn btn-primary">Apply Filters</button>
        </div>
      </div>

      <!-- Transactions -->
      <div class="card" style="padding:20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
          <div class="num" style="font-size:16px; font-weight:700;">Transactions</div>
          <div style="display:flex; align-items:center; gap:12px;">
            <span id="resultSummary" style="font-size:13px; color:var(--text-muted);"></span>
            <button id="exportCsvBtn" class="btn btn-ghost" style="padding:7px 12px; font-size:12.5px;">Export CSV</button>
          </div>
        </div>
        <div style="overflow-x:auto; border:1px solid var(--border); border-radius:10px;">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Account</th>
                <th>Category</th>
                <th>Payee</th>
                <th style="text-align:right;">Amount</th>
              </tr>
            </thead>
            <tbody id="transactionsBody"></tbody>
          </table>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
          <button id="prevPageBtn" class="btn btn-ghost">Previous</button>
          <span id="pageLabel" style="font-size:13px; color:var(--text-muted);"></span>
          <button id="nextPageBtn" class="btn btn-ghost">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ACCOUNT_PALETTE = ['#0EA894', '#4C8DAE', '#8B7FD1', '#E8A33D', '#9C7A54'];

    // --- Theme ---
    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      document.getElementById('themeToggleBtn').innerText = isDark ? '☀️' : '🌙';
    }
    try {
      const stored = localStorage.getItem('theme');
      const isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(isDark);
    } catch (e) { /* localStorage may be unavailable; default light theme is fine */ }
    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const isDark = !document.documentElement.classList.contains('dark');
      applyTheme(isDark);
      try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) { /* ignore */ }
    });

    // --- Error banner ---
    const errorBanner = document.getElementById('errorBanner');
    function showError(message) { errorBanner.innerText = message; errorBanner.hidden = false; }
    function hideError() { errorBanner.hidden = true; }

    const PAGE_SIZE = 50;
    let accountsById = {};
    let categoriesById = {};
    let offset = 0;
    let total = 0;

    function formatAmount(cents) {
      const amt = cents / 100;
      const text = Math.abs(amt).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return amt < 0 ? `-$${text}` : `+$${text}`;
    }

    async function fetchJson(url) {
      let res;
      try {
        res = await fetch(url);
      } catch (err) {
        showError('Could not reach the server.');
        throw err;
      }
      if (res.status === 401) { window.location.href = '/login.html'; throw new Error('unauthorized'); }
      return res.json();
    }

    async function loadAccounts() {
      const accounts = await fetchJson('/api/data/accounts');
      if (accounts.error) { showError(accounts.error); return false; }

      accountsById = Object.fromEntries(accounts.map(a => [a.id, a]));

      const grid = document.getElementById('accountsGrid');
      grid.innerHTML = accounts.map((a, i) => `
        <div class="card-soft" style="padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px;">
          <div style="display:flex; align-items:center; gap:9px; min-width:0;">
            <span style="width:8px; height:8px; border-radius:50%; background:${ACCOUNT_PALETTE[i % ACCOUNT_PALETTE.length]}; flex-shrink:0;"></span>
            <span style="font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${a.name}</span>
          </div>
          <span class="num" style="font-weight:700; font-size:13.5px; color:${a.balance < 0 ? 'var(--negative)' : 'var(--text)'}; flex-shrink:0;">
            ${a.balance < 0 ? '-$' + Math.abs(a.balance).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '$' + a.balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
          </span>
        </div>`).join('');

      const select = document.getElementById('filterAccount');
      select.innerHTML = '<option value="">All accounts</option>' +
        accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
      return true;
    }

    async function loadCategories() {
      const categories = await fetchJson('/api/data/categories');
      if (categories.error) { showError(categories.error); return; }

      categoriesById = Object.fromEntries(categories.map(c => [c.id, c]));

      const select = document.getElementById('filterCategory');
      select.innerHTML = '<option value="">All categories</option>' +
        categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    function currentFilters() {
      const params = new URLSearchParams();
      const accountId = document.getElementById('filterAccount').value;
      const categoryId = document.getElementById('filterCategory').value;
      const startDate = document.getElementById('filterStart').value;
      const endDate = document.getElementById('filterEnd').value;
      const search = document.getElementById('filterSearch').value.trim();
      const sort = document.getElementById('filterSort').value;

      if (accountId) params.set('accountId', accountId);
      if (categoryId) params.set('categoryId', categoryId);
      if (startDate) params.set('startDate', startDate);
      if (endDate) params.set('endDate', endDate);
      if (search) params.set('search', search);
      if (sort) params.set('sort', sort);
      params.set('limit', PAGE_SIZE);
      params.set('offset', offset);
      return params;
    }

    async function loadTransactions() {
      const params = currentFilters();
      const result = await fetchJson('/api/data/transactions?' + params.toString());
      if (result.error) { showError(result.error); return; }
      hideError();

      total = result.total;
      const tbody = document.getElementById('transactionsBody');
      tbody.innerHTML = result.transactions.map(t => `
        <tr>
          <td>${t.date}</td>
          <td>${accountsById[t.account]?.name || 'Unknown'}</td>
          <td>${categoriesById[t.category]?.name || '—'}</td>
          <td>${t.payee_name || 'Unknown'}</td>
          <td class="num" style="text-align:right; font-weight:600; color:${t.amount < 0 ? 'var(--negative)' : 'var(--positive)'};">${formatAmount(t.amount)}</td>
        </tr>`).join('') || `<tr><td style="color:var(--text-muted);" colspan="5">No transactions match these filters.</td></tr>`;

      const from = total === 0 ? 0 : offset + 1;
      const to = Math.min(offset + PAGE_SIZE, total);
      document.getElementById('resultSummary').innerText = `${total} transaction${total === 1 ? '' : 's'}`;
      document.getElementById('pageLabel').innerText = `${from}–${to} of ${total}`;
      document.getElementById('prevPageBtn').disabled = offset === 0;
      document.getElementById('nextPageBtn').disabled = offset + PAGE_SIZE >= total;
    }

    document.getElementById('exportCsvBtn').addEventListener('click', () => {
      const params = currentFilters();
      params.delete('limit');
      params.delete('offset');
      window.location.href = '/api/data/transactions/export?' + params.toString();
    });
    document.getElementById('applyFiltersBtn').addEventListener('click', () => { offset = 0; loadTransactions(); });
    document.getElementById('clearFiltersBtn').addEventListener('click', () => {
      document.getElementById('filterAccount').value = '';
      document.getElementById('filterCategory').value = '';
      document.getElementById('filterStart').value = '';
      document.getElementById('filterEnd').value = '';
      document.getElementById('filterSearch').value = '';
      document.getElementById('filterSort').value = 'date_desc';
      offset = 0;
      loadTransactions();
    });
    document.getElementById('prevPageBtn').addEventListener('click', () => {
      offset = Math.max(0, offset - PAGE_SIZE);
      loadTransactions();
    });
    document.getElementById('nextPageBtn').addEventListener('click', () => {
      offset = offset + PAGE_SIZE;
      loadTransactions();
    });
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    (async function init() {
      let configRes;
      try {
        configRes = await fetch('/api/config');
      } catch (err) {
        showError('Could not reach the server. Check your connection and reload.');
        return;
      }
      if (configRes.status === 401) { window.location.href = '/login.html'; return; }
      const config = await configRes.json();
      if (!config.actualUrl || !config.actualPasswordSet || !config.syncId) {
        document.getElementById('notConfiguredMsg').hidden = false;
        return;
      }

      document.getElementById('explorerBody').hidden = false;
      const ok = await loadAccounts();
      if (!ok) return;
      await loadCategories();
      await loadTransactions();
    })();
  </script>
</body>
</html>
