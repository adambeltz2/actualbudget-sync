services:
  actual-smart-sync:
    # Instead of building locally, they just pull your pre-built image
    image: ghcr.io/adambeltz2/actualbudget-sync:latest
    container_name: actualbudget-sync
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - TIMEZONE=America/New_York
      # Optional: set this to encrypt actualPassword/emailPass at rest in
      # data/config.json. Pick your own value and keep it outside version
      # control; changing it later makes existing saved secrets unreadable.
      # - CONFIG_ENCRYPTION_KEY=change-me-to-a-long-random-value
